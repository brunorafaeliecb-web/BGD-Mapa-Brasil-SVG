<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGD — Mapa do Brasil</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
font-family: system-ui, -apple-system, sans-serif;
background: #0f172a;
color: #e2e8f0;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
}
body.light { background: #f8fafc; color: #0f172a; }
header {
width: 100%;
padding: 16px 20px;
display: flex;
justify-content: space-between;
align-items: center;
}
h1 { font-size: 1.1rem; font-weight: 600; }
.controls { display: flex; gap: 8px; }
button {
background: #1e293b;
color: #e2e8f0;
border: none;
padding: 8px 14px;
border-radius: 999px;
cursor: pointer;
font-size: 13px;
}
body.light button { background: #e2e8f0; color: #0f172a; }
#map-wrap {
flex: 1;
width: 100%;
max-width: 900px;
padding: 10px 20px 40px;
display: flex;
align-items: center;
justify-content: center;
}
svg {
width: 100%;
height: auto;
max-height: 80vh;
filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
}
.state {
cursor: pointer;
transition: fill 0.15s, transform 0.1s;
}
.state:hover { filter: brightness(1.15); }
#popup {
position: fixed;
display: none;
flex-direction: column;
gap: 6px;
background: rgba(15,23,42,0.95);
padding: 10px;
border-radius: 12px;
z-index: 100;
min-width: 220px;
box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
body.light #popup { background: rgba(255,255,255,0.97); }
#popup .btn {
text-align: left;
padding: 10px 12px;
border-radius: 8px;
}
#sun {
position: fixed;
width: 140px; height: 140px;
border-radius: 50%;
background: radial-gradient(circle, rgba(255,220,100,0.35) 0%, transparent 70%);
pointer-events: none;
z-index: 5;
transform: translate(-50%, -50%);
}
#lock {
position: fixed;
bottom: 16px; right: 16px;
font-size: 22px;
cursor: pointer;
z-index: 20;
}
#admin {
display: none;
position: fixed;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
background: #1e293b;
padding: 20px;
border-radius: 14px;
z-index: 200;
min-width: 300px;
}
body.light #admin { background: #fff; color: #0f172a; }
#admin input {
width: 100%;
padding: 8px;
margin: 4px 0 12px;
border-radius: 6px;
border: 1px solid #475569;
}
.credit {
position: fixed;
bottom: 8px; left: 12px;
font-size: 10px;
opacity: 0.5;
}
</style>
</head>
<body>
<div id="sun"></div>
<header>
<h1>BGD — Mapa do Brasil</h1>
<div class="controls">
<button id="darkBtn">Dark / Light</button>
</div>
</header>
<div id="map-wrap">

</svg>
</div>
<div id="popup">
<div id="popup-title" style="font-size:12px;opacity:.7;margin-bottom:6px"></div>
<button class="btn" data-key="saude">Planos de Saúde</button>
<button class="btn" data-key="eletronica">Segurança Eletrônica</button>
<button class="btn" data-key="ti">Segurança da Informação / TI / Automações<br><small>IA</small></button>
</div>
<div id="lock">🔒</div>
<div id="admin">
<h3 style="margin-bottom:12px">Links dos botões</h3>
<label>Planos de Saúde</label>
<input id="link-saude" placeholder="https://...">
<label>Segurança Eletrônica</label>
<input id="link-eletronica" placeholder="https://...">
<label>TI / Automações / IA</label>
<input id="link-ti" placeholder="https://...">
<button id="saveLinks">Salvar</button>
<button id="closeAdmin" style="margin-left:6px">Fechar</button>
</div>
<div class="credit">Mapa: amCharts (CC BY 4.0)</div>
<script>
const links = JSON.parse(localStorage.getItem('bgd-links') || '{}');
const popup = document.getElementById('popup');
const sun = document.getElementById('sun');
document.querySelectorAll('.state').forEach(p => {
p.addEventListener('click', e => {
e.stopPropagation();
const name = p.getAttribute('data-name');
document.getElementById('popup-title').textContent = name;
popup.style.display = 'flex';
popup.style.left = Math.min(e.clientX, window.innerWidth - 240) + 'px';
popup.style.top = Math.min(e.clientY, window.innerHeight - 160) + 'px';
});
});
document.addEventListener('click', e => {
if (!popup.contains(e.target)) popup.style.display = 'none';
});
document.querySelectorAll('#popup .btn').forEach(btn => {
btn.addEventListener('click', () => {
const key = btn.dataset.key;
const url = links[key];
if (url) window.open(url, '_blank');
else alert('Link ainda não definido no admin para: ' + key);
popup.style.display = 'none';
});
});
document.getElementById('darkBtn').addEventListener('click', () => {
document.body.classList.toggle('light');
});
document.addEventListener('mousemove', e => {
sun.style.left = e.clientX + 'px';
sun.style.top = e.clientY + 'px';
});
const admin = document.getElementById('admin');
document.getElementById('lock').addEventListener('click', () => {
document.getElementById('link-saude').value = links.saude || '';
document.getElementById('link-eletronica').value = links.eletronica || '';
document.getElementById('link-ti').value = links.ti || '';
admin.style.display = 'block';
});
document.getElementById('closeAdmin').addEventListener('click', () => admin.style.display = 'none');
document.getElementById('saveLinks').addEventListener('click', () => {
links.saude = document.getElementById('link-saude').value.trim();
links.eletronica = document.getElementById('link-eletronica').value.trim();
links.ti = document.getElementById('link-ti').value.trim();
localStorage.setItem('bgd-links', JSON.stringify(links));
alert('Salvo!');
admin.style.display = 'none';
});
</script>
</body>
</html>
