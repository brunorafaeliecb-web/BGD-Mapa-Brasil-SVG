<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGD — Mapa do Brasil</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; min-height:100vh; }
body.light { background:#f8fafc; color:#0f172a; }
header { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
h1 { font-size:1.1rem; }
button { background:#1e293b; color:#e2e8f0; border:none; padding:8px 14px; border-radius:999px; cursor:pointer; }
body.light button { background:#e2e8f0; color:#0f172a; }
#map-container { width:100%; max-width:700px; margin:0 auto; padding:10px; }
#map { width:100%; height:auto; display:block; background:transparent; }
.state { cursor:pointer; stroke:#0f172a; stroke-width:1; }
.state:hover { filter:brightness(1.2); }
#popup { display:none; position:fixed; background:rgba(15,23,42,.95); padding:10px; border-radius:12px; z-index:100; min-width:200px; }
body.light #popup { background:rgba(255,255,255,.97); }
#popup .btn { display:block; width:100%; text-align:left; margin:4px 0; padding:8px; border-radius:8px; }
#lock { position:fixed; bottom:16px; right:16px; font-size:22px; cursor:pointer; z-index:20; }
#admin { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; padding:20px; border-radius:12px; z-index:200; }
body.light #admin { background:#fff; }
#admin input { width:100%; margin:6px 0; padding:6px; border-radius:6px; }
#sun { position:fixed; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle, rgba(255,220,100,.35) 0%, transparent 70%); pointer-events:none; z-index:5; transform:translate(-50%,-50%); }
</style>
</head>
<body>
<div id="sun"></div>
<header>
  <h1>BGD — Mapa do Brasil</h1>
  <button id="darkBtn">Dark / Light</button>
</header>
<div id="map-container">
  <svg id="map" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<div id="popup">
  <div id="popup-title" style="font-size:12px;opacity:.7;margin-bottom:6px"></div>
  <button class="btn" data-key="saude">Planos de Saúde</button>
  <button class="btn" data-key="eletronica">Segurança Eletrônica</button>
  <button class="btn" data-key="ti">Segurança da Informação / TI / Automações<br><small>IA</small></button>
</div>
<div id="lock">🔒</div>
<div id="admin">
  <h3>Links dos botões</h3>
  <input id="link-saude" placeholder="Planos de Saúde">
  <input id="link-eletronica" placeholder="Segurança Eletrônica">
  <input id="link-ti" placeholder="TI / Automações / IA">
  <button id="saveLinks">Salvar</button>
  <button id="closeAdmin">Fechar</button>
</div>
<script>
const colors = ['#16a34a','#15803d','#166534','#22c55e','#4ade80','#86efac','#14532d','#bbf7d0','#3b82f6','#1d4ed8'];
const links = JSON.parse(localStorage.getItem('bgd-links')||'{}');
const popup = document.getElementById('popup');

fetch('https://cdn.jsdelivr.net/gh/henriquemalvar/br-geojson@main/dist/estados.geojson')
  .then(r => r.json())
  .then(geo => {
    const width = 800, height = 800;
    const projection = d3.geoMercator()
      .fitExtent([[20, 20], [width-20, height-20]], geo);
    const path = d3.geoPath(projection);
    const svg = d3.select('#map');
    svg.attr('viewBox', `0 0 ${width} ${height}`);
    svg.selectAll('path')
      .data(geo.features)
      .enter()
      .append('path')
      .attr('d', path)
      .attr('class', 'state')
      .attr('data-name', d => d.properties.sigla)
      .attr('fill', (d,i) => colors[i % colors.length])
      .on('click', function(e, d) {
        e.stopPropagation();
        document.getElementById('popup-title').textContent = d.properties.sigla + ' — ' + d.properties.nome;
        popup.style.display = 'block';
        popup.style.left = Math.min(e.clientX, innerWidth-220) + 'px';
        popup.style.top = Math.min(e.clientY, innerHeight-140) + 'px';
      });
  })
  .catch(err => {
    document.getElementById('map-container').innerHTML = '<p style="text-align:center;padding:40px">Erro ao carregar o mapa. Tente novamente.</p>';
    console.error(err);
  });

document.addEventListener('click', e => { if (!popup.contains(e.target)) popup.style.display = 'none'; });
document.querySelectorAll('#popup .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const url = links[btn.dataset.key];
    if (url) window.open(url);
    else alert('Link não definido no admin');
    popup.style.display = 'none';
  });
});
document.getElementById('darkBtn').addEventListener('click', () => document.body.classList.toggle('light'));
document.addEventListener('mousemove', e => {
  document.getElementById('sun').style.left = e.clientX + 'px';
  document.getElementById('sun').style.top = e.clientY + 'px';
});
const admin = document.getElementById('admin');
document.getElementById('lock').addEventListener('click', () => {
  document.getElementById('link-saude').value = links.saude||'';
  document.getElementById('link-eletronica').value = links.eletronica||'';
  document.getElementById('link-ti').value = links.ti||'';
  admin.style.display = 'block';
});
document.getElementById('closeAdmin').addEventListener('click', () => admin.style.display = 'none');
document.getElementById('saveLinks').addEventListener('click', () => {
  links.saude = document.getElementById('link-saude').value;
  links.eletronica = document.getElementById('link-eletronica').value;
  links.ti = document.getElementById('link-ti').value;
  localStorage.setItem('bgd-links', JSON.stringify(links));
  alert('Salvo!');
  admin.style.display = 'none';
});
</script>
</body>
</html>
