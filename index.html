<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGD — Mapa do Brasil</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/StrategicProjects/flags-brasil@main/css/flags-brasil.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { color-scheme:dark; --bg:#0f172a; --text:#e2e8f0; --panel:#1e293b; --stroke:#0f172a; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; min-height:100vh; transition:background .25s,color .25s; }
body.light { color-scheme:light; --bg:#f8fafc; --text:#0f172a; --panel:#fff; --stroke:#f8fafc; }
header { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
h1 { font-size:clamp(1rem,3vw,1.35rem); }
button { background:var(--panel); color:var(--text); border:1px solid rgba(148,163,184,.18); padding:9px 15px; border-radius:999px; cursor:pointer; }
button:focus-visible { outline:3px solid #38bdf8; outline-offset:3px; }
#map-container { width:100%; max-width:760px; margin:0 auto; padding:10px; }
#map { width:100%; height:auto; display:block; background:transparent; overflow:visible; }
.state { cursor:pointer; stroke:var(--stroke); stroke-width:1.35; vector-effect:non-scaling-stroke; transition:filter .18s ease,stroke-width .18s ease; }
.state:hover { filter:brightness(1.22) saturate(1.12); stroke:#fff; stroke-width:2.5; }
.state.selected { filter:brightness(1.18) saturate(1.15); stroke:#fff; stroke-width:3; }
#popup { display:none; position:fixed; background:rgba(15,23,42,.97); color:#e2e8f0; border:1px solid rgba(148,163,184,.28); box-shadow:0 18px 55px rgba(0,0,0,.35); padding:14px; border-radius:14px; z-index:100; min-width:220px; max-width:min(300px,calc(100vw - 24px)); }
body.light #popup { background:rgba(255,255,255,.98); color:#0f172a; border-color:#cbd5e1; }
#popup-title { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; margin-bottom:10px; }
#popup-title .fbr { display:inline-block; width:38px; height:27px; flex:0 0 38px; border-radius:3px; box-shadow:0 1px 4px #0005; }
#popup .btn { display:block; width:100%; text-align:left; margin:6px 0 0; padding:10px; border-radius:8px; background:rgba(148,163,184,.14); color:inherit; border:1px solid rgba(148,163,184,.18); }
#popup .btn:hover { background:rgba(56,189,248,.18); }
#lock { position:fixed; bottom:16px; right:16px; font-size:22px; cursor:pointer; z-index:20; }
#admin { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--panel); color:var(--text); padding:20px; border-radius:12px; z-index:200; width:min(360px,calc(100vw - 28px)); box-shadow:0 20px 60px #0007; }
#admin input { width:100%; margin:6px 0; padding:9px; border-radius:6px; border:1px solid #94a3b8; }
#sun { position:fixed; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,220,100,.32) 0%, rgba(255,220,100,.10) 32%, transparent 72%); pointer-events:none; z-index:5; transform:translate(-50%,-50%); mix-blend-mode:screen; }
@media (max-width:600px) { header { padding:14px 12px; } #map-container { padding:4px; } #sun { width:120px; height:120px; } }
@media (hover:none) { #sun { display:none; } }
</style>
</head>
<body>
<div id="sun"></div>
<header>
  <h1>BGD — Mapa do Brasil</h1>
  <button id="darkBtn" type="button" aria-label="Alternar entre modo escuro e claro">Dark / Light</button>
</header>
<div id="map-container">
  <svg id="map" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa interativo dos estados brasileiros"></svg>
</div>
<div id="popup" role="dialog" aria-label="Serviços do estado selecionado">
  <div id="popup-title"></div>
  <button class="btn" data-key="saude">Planos de Saúde e Benefícios</button>
  <button class="btn" data-key="ti">TI, Automação e IA</button>
  <button class="btn" data-key="eletronica">Segurança Eletrônica e Cybersecurity</button>
</div>
<div id="lock" aria-label="Painel administrativo" title="Painel administrativo">🔒</div>
<div id="admin">
  <h3>Links dos botões</h3>
  <input id="link-saude" placeholder="Planos de Saúde">
  <input id="link-eletronica" placeholder="Segurança Eletrônica">
  <input id="link-ti" placeholder="TI / Automações / IA">
  <button id="saveLinks" type="button">Salvar</button>
  <button id="closeAdmin" type="button">Fechar</button>
</div>
<script>
/* Paleta fixa por UF: não depende da ordem recebida no GeoJSON.
   As cores permanecem iguais nos temas claro e escuro. */
const UF_COLORS = {
  AC:'#2878B5', AL:'#E76F51', AP:'#7656C9', AM:'#168C83', BA:'#E9A23B',
  CE:'#D9485F', DF:'#6477C8', ES:'#4F86C6', GO:'#79A83B', MA:'#D69E2E',
  MT:'#1676A8', MS:'#7855A6', MG:'#C64D91', PA:'#169BC2', PB:'#D66A24',
  PR:'#29966F', PE:'#B93D3D', PI:'#8B68C8', RJ:'#287D9B', RN:'#B58A22',
  RO:'#6C9B59', RR:'#D84B45', RS:'#526F9A', SC:'#D98232', SP:'#159A9A',
  SE:'#A04491', TO:'#6752A5'
};
const links = JSON.parse(localStorage.getItem('bgd-links')||'{}');
const popup = document.getElementById('popup');
let selectedState = null;

fetch('https://cdn.jsdelivr.net/gh/henriquemalvar/br-geojson@main/dist/estados.geojson')
  .then(r => { if (!r.ok) throw new Error('Falha ao obter GeoJSON'); return r.json(); })
  .then(geo => {
    const width = 800, height = 800;
    const projection = d3.geoMercator().fitExtent([[20,20],[width-20,height-20]],geo);
    const path = d3.geoPath(projection);
    const svg = d3.select('#map');
    svg.attr('viewBox', `0 0 ${width} ${height}`);
    svg.selectAll('path')
      .data(geo.features)
      .enter()
      .append('path')
      .attr('d',path)
      .attr('class','state')
      .attr('data-name',d => d.properties.sigla)
      .attr('fill',d => UF_COLORS[d.properties.sigla] || '#64748b')
      .attr('aria-label',d => d.properties.nome + ' (' + d.properties.sigla + ')')
      .on('click',function(e,d) {
        e.stopPropagation();
        if (selectedState) selectedState.classList.remove('selected');
        selectedState = this;
        this.classList.add('selected');
        const uf = d.properties.sigla;
        const title = document.getElementById('popup-title');
        title.replaceChildren();
        const flag = document.createElement('span');
        flag.className = 'fbr fbr-' + uf.toLowerCase();
        flag.setAttribute('aria-label','Bandeira de ' + d.properties.nome);
        flag.setAttribute('title','Bandeira de ' + d.properties.nome);
        const label = document.createElement('span');
        label.textContent = d.properties.nome + ' (' + uf + ')';
        title.append(flag,label);
        popup.style.display = 'block';
        const popupWidth = popup.offsetWidth || 240;
        const popupHeight = popup.offsetHeight || 190;
        popup.style.left = Math.max(12,Math.min(e.clientX,innerWidth-popupWidth-12)) + 'px';
        popup.style.top = Math.max(12,Math.min(e.clientY,innerHeight-popupHeight-12)) + 'px';
      });
  })
  .catch(err => {
    document.getElementById('map-container').innerHTML = '<p style="text-align:center;padding:40px">Erro ao carregar o mapa. Tente novamente.</p>';
    console.error(err);
  });

document.addEventListener('click',e => {
  if (!popup.contains(e.target)) popup.style.display = 'none';
});
document.querySelectorAll('#popup .btn').forEach(btn => {
  btn.addEventListener('click',() => {
    const url = links[btn.dataset.key];
    if (url) window.open(url,'_blank','noopener,noreferrer');
    else alert('Link não definido no painel administrativo.');
    popup.style.display = 'none';
  });
});
document.getElementById('darkBtn').addEventListener('click',() => document.body.classList.toggle('light'));
document.addEventListener('mousemove',e => {
  const sun = document.getElementById('sun');
  sun.style.left = e.clientX + 'px';
  sun.style.top = e.clientY + 'px';
});
const admin = document.getElementById('admin');
document.getElementById('lock').addEventListener('click',() => {
  document.getElementById('link-saude').value = links.saude||'';
  document.getElementById('link-eletronica').value = links.eletronica||'';
  document.getElementById('link-ti').value = links.ti||'';
  admin.style.display = 'block';
});
document.getElementById('closeAdmin').addEventListener('click',() => admin.style.display = 'none');
document.getElementById('saveLinks').addEventListener('click',() => {
  links.saude = document.getElementById('link-saude').value;
  links.eletronica = document.getElementById('link-eletronica').value;
  links.ti = document.getElementById('link-ti').value;
  localStorage.setItem('bgd-links',JSON.stringify(links));
  alert('Salvo neste navegador.');
  admin.style.display = 'none';
});
</script>
</body>
</html>
