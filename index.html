<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGD — Mapa do Brasil</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; min-height:100vh; }
  body.light { background:#f8fafc; color:#0f172a; }
  header { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:1.1rem; }
  button { background:#1e293b; color:#e2e8f0; border:none; padding:8px 14px; border-radius:999px; cursor:pointer; }
  body.light button { background:#e2e8f0; color:#0f172a; }
  #map-container { position:relative; max-width:500px; margin:40px auto; height:600px; background:#1e293b; border-radius:12px; }
  body.light #map-container { background:#e2e8f0; }
  .state { position:absolute; cursor:pointer; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; transition:transform .1s; }
  .state:hover { transform:scale(1.05); }
  #popup { display:none; position:fixed; background:rgba(15,23,42,.95); padding:10px; border-radius:12px; z-index:100; min-width:200px; }
  body.light #popup { background:rgba(255,255,255,.97); }
  #popup .btn { display:block; width:100%; text-align:left; margin:4px 0; padding:8px; border-radius:8px; }
  #lock { position:fixed; bottom:16px; right:16px; font-size:22px; cursor:pointer; z-index:20; }
  #admin { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; padding:20px; border-radius:12px; z-index:200; }
  body.light #admin { background:#fff; }
  #admin input { width:100%; margin:6px 0; padding:6px; border-radius:6px; }
  #sun { position:fixed; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle, rgba(255,220,100,.35) 0%, transparent 70%); pointer-events:none; z-index:5; transform:translate(-50%,-50%); }
</style>
</head>
<body>
<div id="sun"></div>
<header>
  <h1>BGD — Mapa do Brasil</h1>
  <button id="darkBtn">Dark / Light</button>
</header>
<div id="map-container">
  <div class="state" data-name="AM" style="left:10%; top:15%; width:18%; height:22%; background:#16a34a;">AM</div>
  <div class="state" data-name="PA" style="left:28%; top:10%; width:18%; height:18%; background:#15803d;">PA</div>
  <div class="state" data-name="MT" style="left:20%; top:35%; width:16%; height:18%; background:#166534;">MT</div>
  <div class="state" data-name="BA" style="left:48%; top:28%; width:14%; height:22%; background:#22c55e;">BA</div>
  <div class="state" data-name="MG" style="left:45%; top:48%; width:12%; height:16%; background:#4ade80;">MG</div>
  <div class="state" data-name="SP" style="left:42%; top:60%; width:12%; height:12%; background:#86efac;">SP</div>
  <div class="state" data-name="RS" style="left:36%; top:78%; width:12%; height:12%; background:#bbf7d0; color:#0f172a;">RS</div>
  <div class="state" data-name="RJ" style="left:52%; top:56%; width:8%; height:8%; background:#14532d;">RJ</div>
  <div class="state" data-name="PR" style="left:38%; top:66%; width:10%; height:8%; background:#22c55e;">PR</div>
  <div class="state" data-name="SC" style="left:36%; top:72%; width:8%; height:6%; background:#16a34a;">SC</div>
  <div class="state" data-name="GO" style="left:38%; top:46%; width:10%; height:10%; background:#15803d;">GO</div>
  <div class="state" data-name="MS" style="left:28%; top:52%; width:10%; height:10%; background:#166534;">MS</div>
  <div class="state" data-name="TO" style="left:40%; top:26%; width:8%; height:12%; background:#4ade80;">TO</div>
  <div class="state" data-name="MA" style="left:46%; top:14%; width:10%; height:12%; background:#22c55e;">MA</div>
  <div class="state" data-name="PI" style="left:52%; top:20%; width:8%; height:10%; background:#16a34a;">PI</div>
  <div class="state" data-name="CE" style="left:58%; top:16%; width:6%; height:8%; background:#15803d;">CE</div>
  <div class="state" data-name="PE" style="left:60%; top:26%; width:8%; height:8%; background:#166534;">PE</div>
  <div class="state" data-name="AC" style="left:4%; top:36%; width:8%; height:8%; background:#86efac; color:#0f172a;">AC</div>
  <div class="state" data-name="RO" style="left:10%; top:40%; width:8%; height:8%; background:#bbf7d0; color:#0f172a;">RO</div>
  <div class="state" data-name="RR" style="left:16%; top:4%; width:6%; height:8%; background:#4ade80;">RR</div>
  <div class="state" data-name="AP" style="left:30%; top:4%; width:6%; height:8%; background:#22c55e;">AP</div>
  <div class="state" data-name="RN" style="left:64%; top:18%; width:5%; height:6%; background:#16a34a;">RN</div>
  <div class="state" data-name="PB" style="left:62%; top:24%; width:5%; height:5%; background:#15803d;">PB</div>
  <div class="state" data-name="AL" style="left:62%; top:30%; width:5%; height:5%; background:#166534;">AL</div>
  <div class="state" data-name="SE" style="left:60%; top:34%; width:5%; height:5%; background:#14532d;">SE</div>
  <div class="state" data-name="ES" style="left:54%; top:52%; width:5%; height:6%; background:#22c55e;">ES</div>
  <div class="state" data-name="DF" style="left:46%; top:50%; width:4%; height:4%; background:#fbbf24; color:#0f172a;">DF</div>
</div>
<div id="popup">
  <div id="popup-title" style="font-size:12px;opacity:.7;margin-bottom:6px"></div>
  <button class="btn" data-key="saude">Planos de Saúde</button>
  <button class="btn" data-key="eletronica">Segurança Eletrônica</button>
  <button class="btn" data-key="ti">Segurança da Informação / TI / Automações<br><small>IA</small></button>
</div>
<div id="lock">🔒</div>
<div id="admin">
  <h3>Links dos botões</h3>
  <input id="link-saude" placeholder="Planos de Saúde">
  <input id="link-eletronica" placeholder="Segurança Eletrônica">
  <input id="link-ti" placeholder="TI / Automações / IA">
  <button id="saveLinks">Salvar</button>
  <button id="closeAdmin">Fechar</button>
</div>
<script>
const links = JSON.parse(localStorage.getItem('bgd-links')||'{}');
const popup = document.getElementById('popup');
document.querySelectorAll('.state').forEach(s => {
  s.addEventListener('click', e => {
    e.stopPropagation();
    document.getElementById('popup-title').textContent = s.dataset.name;
    popup.style.display = 'block';
    popup.style.left = Math.min(e.clientX, innerWidth-220) + 'px';
    popup.style.top = Math.min(e.clientY, innerHeight-140) + 'px';
  });
});
document.addEventListener('click', e => { if (!popup.contains(e.target)) popup.style.display = 'none'; });
document.querySelectorAll('#popup .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const url = links[btn.dataset.key];
    if (url) window.open(url);
    else alert('Link não definido no admin');
    popup.style.display = 'none';
  });
});
document.getElementById('darkBtn').addEventListener('click', () => document.body.classList.toggle('light'));
document.addEventListener('mousemove', e => {
  document.getElementById('sun').style.left = e.clientX + 'px';
  document.getElementById('sun').style.top = e.clientY + 'px';
});
const admin = document.getElementById('admin');
document.getElementById('lock').addEventListener('click', () => {
  document.getElementById('link-saude').value = links.saude||'';
  document.getElementById('link-eletronica').value = links.eletronica||'';
  document.getElementById('link-ti').value = links.ti||'';
  admin.style.display = 'block';
});
document.getElementById('closeAdmin').addEventListener('click', () => admin.style.display = 'none');
document.getElementById('saveLinks').addEventListener('click', () => {
  links.saude = document.getElementById('link-saude').value;
  links.eletronica = document.getElementById('link-eletronica').value;
  links.ti = document.getElementById('link-ti').value;
  localStorage.setItem('bgd-links', JSON.stringify(links));
  alert('Salvo!');
  admin.style.display = 'none';
});
</script>
</body>
</html>
