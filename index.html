<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGD — Mapa 3D do Brasil</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,sans-serif; overflow:hidden; }
  body.light { background:#f1f5f9; color:#0f172a; }
  #info { position:absolute; top:16px; left:16px; z-index:10; }
  h1 { font-size:1.2rem; margin-bottom:8px; }
  button { background:#1e293b; color:#e2e8f0; border:none; padding:8px 14px; border-radius:999px; cursor:pointer; }
  body.light button { background:#e2e8f0; color:#0f172a; }
  #popup { display:none; position:absolute; background:rgba(15,23,42,.95); padding:10px; border-radius:12px; z-index:20; min-width:200px; }
  body.light #popup { background:rgba(255,255,255,.97); }
  #popup .btn { display:block; width:100%; text-align:left; margin:4px 0; padding:8px; border-radius:8px; }
  #lock { position:fixed; bottom:16px; right:16px; font-size:24px; cursor:pointer; z-index:30; }
  #admin { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1e293b; padding:20px; border-radius:12px; z-index:40; }
  body.light #admin { background:#fff; }
  #admin input { width:100%; margin:6px 0; padding:6px; }
  #sun { position:fixed; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,220,100,.3) 0%, transparent 70%); pointer-events:none; z-index:5; transform:translate(-50%,-50%); }
</style>
</head>
<body>
<div id="sun"></div>
<div id="info">
  <h1>BGD — Mapa 3D do Brasil</h1>
  <button id="darkBtn">Dark / Light</button>
</div>
<div id="popup">
  <div id="popup-title" style="font-size:12px;opacity:.7;margin-bottom:6px"></div>
  <button class="btn" data-key="saude">Planos de Saúde</button>
  <button class="btn" data-key="eletronica">Segurança Eletrônica</button>
  <button class="btn" data-key="ti">Segurança da Informação / TI / Automações<br><small>IA</small></button>
</div>
<div id="lock">🔒</div>
<div id="admin">
  <h3>Links dos botões</h3>
  <input id="link-saude" placeholder="Planos de Saúde">
  <input id="link-eletronica" placeholder="Segurança Eletrônica">
  <input id="link-ti" placeholder="TI / Automações / IA">
  <button id="saveLinks">Salvar</button>
  <button id="closeAdmin">Fechar</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const links = JSON.parse(localStorage.getItem('bgd-links')||'{}');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
camera.position.set(0, 8, 18);
camera.lookAt(0,0,0);
const states = [
  {name:'AC', x:-8, z:4, color:0x22c55e},
  {name:'AM', x:-6, z:2, color:0x16a34a},
  {name:'RR', x:-4, z:-1, color:0x15803d},
  {name:'PA', x:-2, z:1, color:0x166534},
  {name:'AP', x:0, z:-2, color:0x14532d},
  {name:'RO', x:-7, z:5, color:0x4ade80},
  {name:'MT', x:-3, z:6, color:0x86efac},
  {name:'TO', x:1, z:4, color:0xbbf7d0},
  {name:'MA', x:3, z:0, color:0x22c55e},
  {name:'PI', x:4, z:2, color:0x16a34a},
  {name:'CE', x:6, z:1, color:0x15803d},
  {name:'RN', x:7, z:0, color:0x166534},
  {name:'PB', x:7.5, z:1.5, color:0x14532d},
  {name:'PE', x:6.5, z:3, color:0x4ade80},
  {name:'AL', x:6, z:4.5, color:0x86efac},
  {name:'SE', x:5.5, z:5.5, color:0xbbf7d0},
  {name:'BA', x:4, z:6, color:0x22c55e},
  {name:'MG', x:2, z:7, color:0x16a34a},
  {name:'ES', x:3.5, z:8, color:0x15803d},
  {name:'RJ', x:2.5, z:8.5, color:0x166534},
  {name:'SP', x:1, z:8, color:0x14532d},
  {name:'PR', x:-1, z:8.5, color:0x4ade80},
  {name:'SC', x:-2, z:9, color:0x86efac},
  {name:'RS', x:-3, z:10, color:0xbbf7d0},
  {name:'MS', x:-2, z:6.5, color:0x22c55e},
  {name:'GO', x:0, z:6, color:0x16a34a},
  {name:'DF', x:0.5, z:6.5, color:0xfbbf24}
];
const meshes = [];
states.forEach(s => {
  const geo = new THREE.BoxGeometry(1.2, 0.4, 1.2);
  const mat = new THREE.MeshStandardMaterial({color:s.color});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(s.x, 0.2, s.z);
  mesh.userData = s;
  scene.add(mesh);
  meshes.push(mesh);
});
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const popup = document.getElementById('popup');
renderer.domElement.addEventListener('click', e => {
  mouse.x = (e.clientX / innerWidth)*2 -1;
  mouse.y = -(e.clientY / innerHeight)*2 +1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length) {
    const s = hits[0].object.userData;
    document.getElementById('popup-title').textContent = s.name;
    popup.style.display = 'block';
    popup.style.left = Math.min(e.clientX, innerWidth-220) + 'px';
    popup.style.top = Math.min(e.clientY, innerHeight-140) + 'px';
  } else popup.style.display = 'none';
});
document.querySelectorAll('#popup .btn').forEach(btn => {
  btn.onclick = () => {
    const url = links[btn.dataset.key];
    if (url) window.open(url);
    else alert('Link não definido');
    popup.style.display = 'none';
  };
});
document.getElementById('darkBtn').onclick = () => document.body.classList.toggle('light');
document.addEventListener('mousemove', e => {
  document.getElementById('sun').style.left = e.clientX + 'px';
  document.getElementById('sun').style.top = e.clientY + 'px';
});
const admin = document.getElementById('admin');
document.getElementById('lock').onclick = () => {
  document.getElementById('link-saude').value = links.saude||'';
  document.getElementById('link-eletronica').value = links.eletronica||'';
  document.getElementById('link-ti').value = links.ti||'';
  admin.style.display = 'block';
};
document.getElementById('closeAdmin').onclick = () => admin.style.display = 'none';
document.getElementById('saveLinks').onclick = () => {
  links.saude = document.getElementById('link-saude').value;
  links.eletronica = document.getElementById('link-eletronica').value;
  links.ti = document.getElementById('link-ti').value;
  localStorage.setItem('bgd-links', JSON.stringify(links));
  alert('Salvo');
  admin.style.display = 'none';
};
function animate() {
  requestAnimationFrame(animate);
  scene.rotation.y += 0.002;
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
